data:
  class_path: datasets.PedestrianDataModule
  init_args:
    data_dir: "/home/dangmanh/thesis/Data/Wildtrack"
    drop_ratio: 0  # 0=full; 20/45/60 -> drop_annotations/drop_XX
    pseudo_cache: null  # Optional MVDetBRL detector cache; training split only
    pseudo_conf_threshold: 0.5
    pseudo_sigma_m: 0.5
    pseudo_suppress_radius_m: 1.0
model:
  resolution: [120, 4, 360]  # Y,Z,X
  bounds: [0, 1440, 0, 480, 0, 200]  # xmin,xmax,ymin,ymax,zmin,zmax
  depth: [32, 250, 3250]
  num_cameras: 7
  use_temporal_cache: False
  apply_brl: true
  brl_pos_thr: 0.1
  brl_confuse_thr: 0.4
  brl_beta: 0.05
  use_distance_weight: false
  pseudo_loss_weight: 0.01
trainer:
  max_epochs: 30
