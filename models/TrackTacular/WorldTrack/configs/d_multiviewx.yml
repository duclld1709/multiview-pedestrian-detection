data:
  class_path: datasets.PedestrianDataModule
  init_args:
    data_dir: "/usr/home/tee/Developer/datasets/MultiviewX"
    drop_ratio: 0  # 0 = full labels; 20/45/60 = drop_annotations/drop_XX (train split only)
