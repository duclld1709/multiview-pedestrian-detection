data:
  class_path: datasets.PedestrianDataModule
  init_args:
    data_dir: "/kaggle/working/Data_temp/MultiviewX"
    drop_ratio: 0  # 0=full; 20/45/60 -> drop_annotations/drop_XX
model:
  resolution: [160, 2, 250]  # Y,Z,X
  bounds: [0, 1000, 0, 640, 0, 2]  # xmin,xmax,ymin,ymax,zmin,zmax
  depth: [32, 0, -20]
  z_sign: -1
  num_cameras: 6
trainer:
  max_epochs: 50
